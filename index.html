<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>Macroxel</title><style>html,body{margin:0;height:100%;font-family:system-ui;background:#eef6fb}#b{height:100%;display:grid;place-items:center;color:#123b5d;font-weight:900}#b i{width:12px;height:12px;border-radius:50%;background:#2563eb;display:inline-block;margin-right:10px;animation:p .8s alternate infinite}@keyframes p{to{opacity:.35;transform:scale(.7)}}</style></head><body><div id="b"><div><i></i>Cargando Macroxel…</div></div><script>
(async()=>{
 const baseUrl='https://raw.githubusercontent.com/janethzarate86-ux/TRANSFERENCIAS/af946dcfa240bf933683c339d99adcbefac810b0/index.html';
 const [br,pr]=await Promise.all([fetch(baseUrl,{cache:'no-store'}),fetch('mx_patch.b64?v=100',{cache:'no-store'})]);if(!br.ok||!pr.ok)throw new Error('No se pudo cargar la aplicación');
 let base=await br.text(), b64=(await pr.text()).trim();const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const patch=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
 function apply(src,d){let a=src.split('\n'),o=[],pos=0,ls=d.split('\n'),i=0;while(i<ls.length){let m=ls[i].match(/^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/);if(!m){i++;continue}let start=+m[1]-1;while(pos<start)o.push(a[pos++]);i++;while(i<ls.length&&!ls[i].startsWith('@@ ')){let x=ls[i];if(x.startsWith(' ')){o.push(a[pos++]??'')}else if(x.startsWith('-')){pos++}else if(x.startsWith('+')){o.push(x.slice(1))}else if(x.startsWith('\ No newline')){}i++}}while(pos<a.length)o.push(a[pos++]);return o.join('\n')}
 const html=apply(base,patch);document.open();document.write(html);document.close();
})().catch(e=>{document.getElementById('b').innerHTML='<div style="padding:25px;color:#b91c1c">No se pudo iniciar Macroxel.<br><small>'+String(e.message||e)+'</small></div>'});
</script></body></html>
