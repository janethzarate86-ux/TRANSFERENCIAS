name: Macroxel Release
on:
  push:
    paths: ['.macroxel/release.patch.gz.b64']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: macroxel-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Aplicar release Macroxel
        shell: bash
        run: |
          set -euo pipefail
          SRC='.macroxel/release.patch.gz.b64'
          PATCH='/tmp/macroxel-release.patch'
          base64 -d "$SRC" | gzip -d > "$PATCH"
          if git apply --check --whitespace=nowarn "$PATCH"; then
            git apply --whitespace=nowarn "$PATCH"
          elif git apply --reverse --check --whitespace=nowarn "$PATCH"; then
            echo 'Release ya aplicada.'; exit 0
          else
            echo '::error::La release no coincide con el index actual. No se modificó nada.'; exit 1
          fi
          git config user.name 'Macroxel Updater'
          git config user.email 'macroxel-updater@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Macroxel v1.0.1'
          git push
