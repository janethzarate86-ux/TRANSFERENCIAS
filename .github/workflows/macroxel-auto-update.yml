name: Macroxel Auto Update

on:
  push:
    paths:
      - '.macroxel/apply.patch'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macroxel-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar actualización Macroxel
        shell: bash
        run: |
          set -euo pipefail
          PATCH='.macroxel/apply.patch'
          if [ ! -s "$PATCH" ]; then
            echo 'No hay actualización pendiente.'
            exit 0
          fi
          if git apply --check --whitespace=nowarn "$PATCH"; then
            git apply --whitespace=nowarn "$PATCH"
          elif git apply --reverse --check --whitespace=nowarn "$PATCH"; then
            echo 'La actualización ya está aplicada.'
            exit 0
          else
            echo '::error::La actualización no coincide con la versión actual. No se modificó index.html.'
            exit 1
          fi
          git config user.name 'Macroxel Updater'
          git config user.email 'macroxel-updater@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Sin cambios para publicar.'
            exit 0
          fi
          git commit -m 'Macroxel: actualización automática'
          git push
